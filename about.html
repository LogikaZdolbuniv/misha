
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider KFC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="container">
            <h1>🕷️ Spider KFC</h1>

            <nav>
                <ul>
                    <li><a href="index.html">Головна</a></li>
                    <li><a href="menu.html">Меню</a></li>
                    <li><a href="about.html">Бронювання</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

<form class="booking">
    <h2>Забронювати столик</h2>

    <label for="name">Ім'я</label>
    <input type="text" id="name" name="name" placeholder="Ваше ім'я" required>

    <label for="phone">Телефон</label>
    <input type="tel" id="phone" name="phone" placeholder="+380..." required>

    <label for="date">Дата</label>
    <input type="date" id="date" name="date" required>

    <label for="time">Час</label>
    <input type="time" id="time" name="time" required>

    <label for="guests">Кількість гостей</label>
    <select id="guests" name="guests">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
    </select>

    <button type="submit">Забронювати</button>
</form>


    </main>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <p>© 2026 Spider KFC. Усі права захищені.</p>
        </div>
    </footer>

</body>
</html>
